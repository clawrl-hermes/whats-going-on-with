name: Rebuild the site
on:
  push:
    branches: [main]
    paths:
      - '*/overview.md'
      - '*/updates/**'
      - '*/articles/**'
      - '*/entities/**'
      - '*/concepts/**'
      - '*/sources.md'
      - '*/timeline/**'
      - '*/current-situation.md'
      - '*/priority-sources.md'
      - 'content-contract.md'
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
